name: LegacyMapFix
version: '${project.version}'
main: org.eu.lunworld.legacymapfix.LegacyMapFixPlugin
api-version: '1.21'
description: ${project.description}
authors: [TW527E]
website: https://github.com/Lunluns-World
softdepend: [HuskSync]
commands:
  legacymapfix:
    description: Inspect and convert legacy HuskSync locked maps
    usage: /<command> [inspect|fix|scan|frames|stats|reload]
    aliases: [lmf]
    permission: legacymapfix.admin
permissions:
  legacymapfix.admin:
    description: Use /legacymapfix
    default: op
